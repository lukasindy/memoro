<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta http-equiv="Cache-Control" content="no-cache" />
    <meta name="description" content="Memoro – Vokabeln lernen mit deinen eigenen Wortlisten." />

    <!-- Als App vom Homebildschirm starten (ohne Safari-Leisten) -->
    <link rel="manifest" href="/memoro/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Memoro" />
    <meta name="theme-color" content="#EEF1EC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111917" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/memoro/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/memoro/icon-192.png" />

    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #eef1ec;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #111917;
        }
      }
      /* Wichtig: KEIN overflow:hidden auf html/body, sonst schneidet iOS bei der (zu kleinen) Fensterhöhe ab.
         --app-h = echte Bildschirmhöhe, wird unten per Skript gesetzt. */
      body {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        width: 100%;
        height: var(--app-h, 100%);
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      #root {
        display: flex;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 100%;
        overflow: hidden;
        flex: 1;
      }
    </style>
    <script>
      // iOS meldet in der Home-Bildschirm-App eine um die Statusleiste zu kleine Fensterhöhe (innerHeight).
      // Darum die echte Bildschirmhöhe verwenden, solange sie nur wenig größer ist.
      (function () {
        var root = document.documentElement;
        function set() {
          try {
            var standalone = window.navigator.standalone || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
            var portrait = window.innerHeight >= window.innerWidth;
            var full = portrait ? Math.max(screen.height, screen.width) : Math.min(screen.height, screen.width);
            var diff = full - window.innerHeight;
            if (standalone && diff > 0 && diff <= 100) root.style.setProperty('--app-h', full + 'px');
            else root.style.removeProperty('--app-h');
          } catch (e) {}
        }
        set();
        window.addEventListener('resize', set);
        window.addEventListener('orientationchange', function () { setTimeout(set, 250); });
      })();
    </script>
  </head>

  <body>
    <noscript>Memoro braucht JavaScript.</noscript>
    <div id="root"></div>
  </body>
</html>
